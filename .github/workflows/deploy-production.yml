name: Deploy to Production Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Static Site to Production Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: production
          clean: true
          commit-message: "deploy: build & sync from main [skip ci]"
