name: Deploy to production branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dist (public files only)
        run: |
          mkdir dist
          cp *.html dist/ 2>/dev/null || true
          cp -r assets showrooms dist/
          cp -r *.png *.ico *.svg *.txt *.xml site.webmanifest .htaccess dist/ 2>/dev/null || true

      - name: Stamp asset versions with commit hash (cache busting)
        run: |
          SHA="${GITHUB_SHA::8}"
          find dist -maxdepth 2 -name "*.html" -exec sed -i "s/?v=[0-9A-Za-z.-]*/?v=${SHA}/g" {} +

      - name: Publish dist to production
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: production
          publish_dir: ./dist
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
